log_format realtime_session '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

upstream ani_governance {
  server ani-governance.ani-system:7788;
}

upstream ani_session_gateway {
  server ani-session-gateway-websocket.ani-system:8080;
}

upstream cdi_uploadproxy {
  server cdi-uploadproxy.cdi:443;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_cache off;

  location /api/console-sessions/ {
    proxy_pass http://ani_session_gateway/api/v1/realtime/sessions/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie "";
    proxy_next_upstream off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    access_log /var/log/nginx/access.log realtime_session;
  }

  location = /api/uploads/vm-images {
    proxy_pass https://cdi_uploadproxy/v1beta1/upload-async;
    proxy_set_header Host cdi-uploadproxy.cdi;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_ssl_name cdi-uploadproxy.cdi;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    client_max_body_size 0;
    client_body_timeout 3600s;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://ani_governance;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
